<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🎮 PONG GAME 🎮</h1>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="scoreboard">
            <div class="score-box">
                <div class="score-label">Player</div>
                <div class="score-value" id="playerScore">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Computer</div>
                <div class="score-value" id="computerScore">0</div>
            </div>
        </div>

        <div class="controls">
            <p><strong>🖱️ Mouse:</strong> Move your paddle with mouse Y-position</p>
            <p><strong>⌨️ Keyboard:</strong> Use ⬆️ Arrow Up & ⬇️ Arrow Down (or W & S)</p>
            <p><strong>🤖 Computer:</strong> Try to beat the AI opponent!</p>
        </div>

        <button id="resetBtn">🔄 Reset Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
